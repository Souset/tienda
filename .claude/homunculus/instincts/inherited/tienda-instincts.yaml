# Tienda Workflow Add New Feature Module

## Action

Follow the add-new-feature-module workflow:
1. Create data/repositories/feature_repository_impl.dart
2. Create domain/repositories/feature_repository.dart
3. Create presentation/providers/feature_providers.dart
4. Create presentation/screens/feature_screen.dart (and detail screens if needed)
5. Create presentation/widgets/ as needed
6. Wire up routes in core/router/app_router.dart
7. Add tests in test/features/feature/feature_screen_test.dart

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: cine_luz_del_mar/app/lib/features/*/data/repositories/*.dart, cine_luz_del_mar/app/lib/features/*/domain/repositories/*.dart, cine_luz_del_mar/app/lib/features/*/presentation/providers/*.dart

